<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snap to Screen</title>
<style>
  :root { --brand:#0f2c4c; --accent:#c99a2e; --bg:#f4f6f9; --card:#fff; --text:#14202e; --muted:#5b6878; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; padding:16px; }
  main { width:100%; max-width:560px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
  .mark { background:var(--brand); color:#fff; font-weight:800; border-radius:10px; padding:8px 12px; letter-spacing:.04em; }
  h1 { font-size:26px; margin:0; }
  a.card { display:block; background:var(--card); border-radius:14px; padding:20px 22px; margin-bottom:14px; text-decoration:none; color:inherit;
           box-shadow:0 1px 3px rgba(0,0,0,.08); border-left:6px solid var(--accent); }
  a.card:hover { box-shadow:0 4px 14px rgba(0,0,0,.12); }
  a.card strong { font-size:19px; display:block; }
  a.card span { color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark" id="mark">CIS</span><h1 id="app">Snap to Screen</h1></div>
  <a class="card" href="board.html"><strong>Board</strong><span>Open on the classroom laptop / SMART Board, then go full screen.</span></a>
  <a class="card" href="phone.html"><strong>Phone</strong><span>Open on your iPhone. Tip: Share → Add to Home Screen so it opens like an app.</span></a>
</main>
<script src="config.js?v=3"></script>
<script>
  const c = window.SNAP_CONFIG || {};
  if (c.schoolShort) document.getElementById('mark').textContent = c.schoolShort;
  if (c.appName) { document.getElementById('app').textContent = c.appName; document.title = c.appName; }
</script>
</body>
</html>
