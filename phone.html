<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snap">
<meta name="theme-color" content="#0f2c4c">
<title>Snap to Screen – Phone</title>
<style>
  :root {
    --brand:#0f2c4c; --brand-2:#1d4673; --accent:#c99a2e;
    --bg:#f4f6f9; --card:#ffffff; --text:#14202e; --muted:#5b6878; --line:#dde3ea;
    --ok:#15803d; --bad:#b91c1c; --warn:#a16207;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1621; --card:#17212e; --text:#e8eef5; --muted:#9aa8b8; --line:#2a3646; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font:17px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
  body { min-height:100vh; padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; gap:10px; padding:14px 0 10px; }
  .mark { background:var(--brand); color:#fff; font-weight:800; border-radius:8px; padding:4px 9px; font-size:14px; letter-spacing:.04em; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header .room { font-size:13px; color:var(--muted); display:block; font-weight:400; }
  .icon-btn { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px; padding:8px 12px; font-size:14px; }
  .hidden { display:none !important; }

  .snap-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    width:100%; min-height:42vh; margin:12px 0; border-radius:22px; border:0;
    background:linear-gradient(160deg, var(--brand-2), var(--brand)); color:#fff;
    font-size:26px; font-weight:700; cursor:pointer; box-shadow:0 8px 24px rgba(15,44,76,.35); }
  .snap-btn:active { transform:scale(.985); }
  .snap-btn svg { width:84px; height:84px; }
  .snap-btn small { font-size:15px; font-weight:400; opacity:.85; }
  .lib-btn { display:block; text-align:center; width:100%; padding:14px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--text); font-size:17px; font-weight:600; cursor:pointer; }
  .tip { color:var(--muted); font-size:14px; margin:12px 4px 18px; display:flex; gap:8px; }
  .tip b { color:var(--accent); }

  ul.sent { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
  ul.sent li { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px; }
  ul.sent img { width:64px; height:64px; object-fit:cover; border-radius:9px; background:#ccc; flex:none; }
  ul.sent .info { flex:1; min-width:0; }
  ul.sent .status { font-weight:600; font-size:15px; }
  ul.sent .time { color:var(--muted); font-size:13px; }
  .st-sending { color:var(--warn); } .st-ok { color:var(--ok); } .st-fail { color:var(--bad); }
  ul.sent button { border:1px solid var(--line); background:transparent; color:var(--text); border-radius:10px; padding:8px 10px; font-size:14px; }
  h2 { font-size:15px; color:var(--muted); font-weight:600; margin:22px 4px 10px; text-transform:uppercase; letter-spacing:.05em; }

  .gate { max-width:420px; margin:10vh auto 0; background:var(--card); border-radius:18px; padding:22px; border:1px solid var(--line); }
  .gate h2 { margin:0 0 6px; color:var(--text); text-transform:none; letter-spacing:0; font-size:20px; }
  .gate p { color:var(--muted); margin:0 0 16px; font-size:15px; }
  .gate input { width:100%; font-size:18px; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  .gate button { margin-top:12px; width:100%; padding:14px; border-radius:12px; border:0; background:var(--brand); color:#fff; font-size:17px; font-weight:700; }
  .err { color:var(--bad); font-size:14px; margin-top:10px; min-height:1em; }
  .notice { background:var(--card); border:1px solid var(--line); border-left:5px solid var(--warn); padding:14px; border-radius:12px; margin-top:16px; }
</style>
</head>
<body>
<header>
  <span class="mark" id="mark">CIS</span>
  <h1><span id="appName">Snap to Screen</span><span class="room" id="roomLabel"></span></h1>
  <button class="icon-btn hidden" id="signOut" type="button">Sign out</button>
</header>

<div id="notConfigured" class="notice hidden">
  <strong>Not set up yet.</strong> Add the Supabase URL and key to <code>config.js</code> (see README).
</div>

<form id="gate" class="gate hidden" autocomplete="off">
  <h2>Enter your passcode</h2>
  <p>You only need to do this once on this phone.</p>
  <input id="code" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="Passcode" required>
  <button type="submit" id="gateBtn">Continue</button>
  <div class="err" id="gateErr"></div>
</form>

<main id="main" class="hidden">
  <label class="snap-btn" for="camera">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.5-2h6.6l1.5 2h1.7A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.5" r="4"/></svg>
    Snap to board
    <small>Photo appears on the board straight away</small>
  </label>
  <input id="camera" type="file" accept="image/*" capture="environment" class="hidden">

  <label class="lib-btn" for="library">Choose from Photos…</label>
  <input id="library" type="file" accept="image/*" multiple class="hidden">

  <p class="tip"><b>●</b><span>Keep faces out of shot, and cover names if the work is going on screen.</span></p>

  <h2 id="sentTitle" class="hidden">Sent this lesson</h2>
  <ul class="sent" id="sent"></ul>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="phone.js"></script>
</body>
</html>
